body{

select{

button{

button:hover{

.question-number{
    color:#666;
    margin-bottom:10px;
}

.question{
    font-size:20px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    background:#f3f4f6;
    color:#222;
    border:2px solid transparent;
    text-align:left;
    margin:10px 0;
}

.option:hover{
    background:#e5e7eb;
}

.option.selected{
    border-color:#2563eb;
    background:#dbeafe;
}

.navigation{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.navigation button{
    flex:1;
}

.progress{
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#2563eb;
}

.result{
    text-align:center;
}

.score{
    font-size:40px;
    font-weight:bold;
    color:#2563eb;
}

.review-item{
    padding:15px;
    margin:10px 0;
    border-radius:8px;
    background:#f3f4f6;
}

.correct{
    border-left:5px solid green;
}

.wrong{
    border-left:5px solid red;
}

.hidden{
    display:none;
}

.back{
    display:block;
    text-align:center;
    margin:20px 0;
    color:#2563eb;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1>🧩 MOAU STUDY HUB</h1>
    <p>QUIZZES • LEARN • GROW • BECOME</p>
</header>

<div class="container">

<!-- SUBJECT SELECTION -->

<div id="setup" class="card">

    <h2>📝 Choose Your Subject</h2>

    <select id="subjectSelect">

        <option value="phy102">PHY 102</option>
        <option value="chm102">CHM 102</option>
        <option value="bio102">BIO 102</option>
        <option value="mth102">MTH 102</option>
        <option value="cos102">COS 102</option>

    </select>

    <button onclick="startQuiz()">
        🚀 Start 50-Question Quiz
    </button>

</div>


<!-- QUIZ -->

<div id="quiz" class="card hidden">

    <h2 id="subjectTitle"></h2>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-number" id="questionNumber"></div>

    <div class="question" id="question"></div>

    <div id="options"></div>

    <div class="navigation">

        <button onclick="previousQuestion()">
            ← Previous
        </button>

        <button onclick="nextQuestion()">
            Next →
        </button>

    </div>

    <button onclick="submitQuiz()">
        ✅ Submit Quiz
    </button>

</div>


<!-- RESULT -->

<div id="result" class="card hidden result">

    <h2>🎉 Quiz Completed!</h2>

    <p id="resultSubject"></p>

    <div class="score" id="score"></div>

    <p id="percentage"></p>

    <button onclick="showReview()">
        📋 Review Answers
    </button>

    <button onclick="retryQuiz()">
        🔄 Retry Quiz
    </button>

    <button onclick="goQuizIndex()">
        🧩 Choose Another Subject
    </button>

</div>


<!-- REVIEW -->

<div id="review" class="card hidden">

    <h2>📋 Answer Review</h2>

    <div id="reviewContent"></div>

    <button onclick="retryQuiz()">
        🔄 Retry Quiz
    </button>

</div>

<a href="quiz-index.html" class="back">
    ← Back to Quiz Index
</a>

</div>

/* =========================================================
   QUIZ VARIABLES
========================================================= */

let currentSubject = "";
let currentQuestions = [];
let currentQuestion = 0;
let userAnswers = [];
let finalScore = 0;


/* =========================================================
   SUBJECT NAMES
========================================================= */

const subjectNames = {
    phy102:"PHY 102",
    chm102:"CHM 102",
    bio102:"BIO 102",
    mth102:"MTH 102",
    cos102:"COS 102"
};


/* =========================================================
   START QUIZ
========================================================= */

function startQuiz(){

    currentSubject =
        document.getElementById("subjectSelect").value;

    currentQuestions =
        quizData[currentSubject];

    if(!currentQuestions || currentQuestions.length !== 50){

        alert("This subject does not contain exactly 50 questions.");

        return;
    }

    currentQuestion = 0;

    userAnswers =
        new Array(currentQuestions.length).fill(null);

    document.getElementById("setup")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("review")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    document.getElementById("subjectTitle").innerText =
        subjectNames[currentSubject] + " — 50 Questions";

    loadQuestion();
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    const q =
        currentQuestions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        currentQuestions.length;

    document.getElementById("question").innerText =
        q[0];

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q[1].forEach((option,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        if(userAnswers[currentQuestion] === index){
            button.classList.add("selected");
        }

        button.onclick = function(){

            selectAnswer(index);

        };

        options.appendChild(button);

    });


    const progress =
        ((currentQuestion + 1) /
        currentQuestions.length) * 100;

    document.getElementById("progressBar")
        .style.width = progress + "%";
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index){

    userAnswers[currentQuestion] =
        index;

    loadQuestion();
}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

    if(currentQuestion <
       currentQuestions.length - 1){

        currentQuestion++;

        loadQuestion();

    }else{

        alert("You are on the last question. Click Submit Quiz.");

    }
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

    }

}


/* =========================================================
   SUBMIT
========================================================= */

function submitQuiz(){

    const unanswered =
        userAnswers.filter(
            answer => answer === null
        ).length;

    if(unanswered > 0){

        const proceed =
            confirm(
                "You have " +
                unanswered +
                " unanswered question(s).\n\n" +
                "Do you still want to submit?"
            );

        if(!proceed){
            return;
        }
    }


    finalScore = 0;

    currentQuestions.forEach((q,index)=>{

        if(userAnswers[index] === q[2]){

            finalScore++;

        }

    });


    const percent =
        (finalScore /
        currentQuestions.length) * 100;


    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.remove("hidden");


    document.getElementById("resultSubject")
        .innerText =
        subjectNames[currentSubject];


    document.getElementById("score")
        .innerText =
        finalScore + " / 50";


    document.getElementById("percentage")
        .innerText =
        percent.toFixed(1) + "%";
}


/* =========================================================
   REVIEW
========================================================= */

function showReview(){

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("review")
        .classList.remove("hidden");

    const review =
        document.getElementById("reviewContent");

    review.innerHTML = "";


    currentQuestions.forEach((q,index)=>{

        const item =
            document.createElement("div");

        const correct =
            userAnswers[index] === q[2];

        item.className =
            "review-item " +
            (correct ? "correct" : "wrong");


        let userAnswer =
            userAnswers[index] === null
            ? "Not answered"
            : q[1][userAnswers[index]];


        let correctAnswer =
            q[1][q[2]];


        item.innerHTML =

            "<strong>Question " +
            (index + 1) +
            ":</strong><br>" +

            q[0] +

            "<br><br>" +

            "Your answer: " +
            userAnswer +

            "<br>" +

            "Correct answer: " +
            correctAnswer;

        review.appendChild(item);

    });

}


/* =========================================================
   RETRY
========================================================= */

function retryQuiz(){

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("review")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    currentQuestion = 0;

    userAnswers =
        new Array(currentQuestions.length).fill(null);

    loadQuestion();
}


/* =========================================================
   QUIZ INDEX
========================================================= */

function goQuizIndex(){

    window.location.href =
        "quiz-index.html";
}


/* =========================================================
   READ SUBJECT FROM QUIZ INDEX
========================================================= */

window.onload = function(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const subject =
        params.get("subject");

    if(subject && quizData[subject]){

        document.getElementById("subjectSelect")
            .value = subject;

        startQuiz();

    }

};
