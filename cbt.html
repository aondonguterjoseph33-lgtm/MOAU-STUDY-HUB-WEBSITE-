.question-number{

.question{

.option:hover{

.navigation{

.result{
    text-align:center;
}

.score{
    font-size:42px;

.hidden{
    display:none;
}

.warning{
    color:#c00000;
    font-weight:bold;
}

.review{
    margin-top:20px;
    padding:15px;
    background:#f5f7fb;

.correct{

.wrong{

footer{

/* =====================================================
   CBT VARIABLES
   ===================================================== */

let currentQuestion = 0;

let userAnswers = [];

let timeLeft = 60 * 60;

let timerInterval;


/* =====================================================
   START TEST
   ===================================================== */

function startTest(){

    const name =
        document.getElementById("studentName").value.trim();

    const matric =
        document.getElementById("matricNumber").value.trim();

    if(name === "" || matric === ""){

        alert("Please enter your name and matric number.");

        return;

    }

    if(questions.length < 100){

        alert(
            "The question bank contains only " +
            questions.length +
            " questions."
        );

        return;

    }

    currentQuestion = 0;

    userAnswers = new Array(100).fill(null);

    timeLeft = 60 * 60;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("quizScreen")
        .classList.remove("hidden");

    showQuestion();

    startTimer();

}


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        "Question " +
        (currentQuestion + 1) +
        " of 100";

    document.getElementById("question").innerHTML =
        q.question;

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    const letters = ["A","B","C","D"];

    q.options.forEach(function(option,index){

        const label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML =
            '<input type="radio" name="option" value="' +
            letters[index] +
            '" ' +
            (userAnswers[currentQuestion] === letters[index]
            ? "checked"
            : "") +
            '> ' +
            letters[index] +
            ". " +
            option;

        optionsDiv.appendChild(label);

    });

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / 100 * 100) + "%";

}


/* =====================================================
   SAVE ANSWER
   ===================================================== */

function saveAnswer(){

    const selected =
        document.querySelector(
            'input[name="option"]:checked'
        );

    if(selected){

        userAnswers[currentQuestion] =
            selected.value;

    }

}


/* =====================================================
   NEXT QUESTION
   ===================================================== */

function nextQuestion(){

    saveAnswer();

    if(currentQuestion < 99){

        currentQuestion++;

        showQuestion();

    }

}


/* =====================================================
   PREVIOUS QUESTION
   ===================================================== */

function previousQuestion(){

    saveAnswer();

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

}


/* =====================================================
   TIMER
   ===================================================== */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(function(){

            timeLeft--;

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            document.getElementById("timer").innerHTML =
                String(minutes).padStart(2,"0") +
                ":" +
                String(seconds).padStart(2,"0");

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                alert(
                    "Time is up! Your test will be submitted."
                );

                submitTest();

            }

        },1000);

}


/* =====================================================
   SUBMIT TEST
   ===================================================== */

function submitTest(){

    saveAnswer();

    const unanswered =
        userAnswers.filter(
            answer => answer === null
        ).length;

    if(unanswered > 0){

        const confirmSubmit =
            confirm(
                "You have " +
                unanswered +
                " unanswered question(s). " +
                "Do you want to submit?"
            );

        if(!confirmSubmit){

            return;

        }

    }

    clearInterval(timerInterval);

    let score = 0;

    for(let i = 0; i < 100; i++){

        if(
            userAnswers[i] ===
            questions[i].answer
        ){

            score++;

        }

    }

    showResult(score);

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showResult(score){

    document.getElementById("quizScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    const name =
        document.getElementById("studentName").value;

    const matric =
        document.getElementById("matricNumber").value;

    const percentage =
        score;

    document.getElementById("studentResult").innerHTML =
        "<strong>Name:</strong> " +
        name +
        "<br><strong>Matric No:</strong> " +
        matric;

    document.getElementById("score").innerHTML =
        score + " / 100";

    document.getElementById("percentage").innerHTML =
        "Percentage: " +
        percentage +
        "%";

    let remark;

    if(score >= 70){

        remark = "Excellent performance! 🎉";

    }
    else if(score >= 50){

        remark = "Good attempt. Keep studying! 📚";

    }
    else if(score >= 40){

        remark = "Fair attempt. More revision is needed. 💪";

    }
    else{

        remark = "Keep practicing and reviewing your PHY 102 notes. 📖";

    }

    document.getElementById("remark").innerHTML =
        "<strong>" + remark + "</strong>";

    createReview();

}


/* =====================================================
   ANSWER REVIEW
   ===================================================== */

function createReview(){

    let html =
        "<h3>📋 Answer Review</h3>";

    for(let i = 0; i < 100; i++){

        const user =
            userAnswers[i];

        const correct =
            questions[i].answer;

        if(user === correct){

            html +=
                "<p class='correct'>" +
                "Question " +
                (i + 1) +
                ": ✓ Correct</p>";

        }
        else{

            html +=
                "<p class='wrong'>" +
                "Question " +
                (i + 1) +
                ": ✗ Wrong" +
                "<br>Your answer: " +
                (user || "Not answered") +
                "<br>Correct answer: " +
                correct +
                "</p>";

        }

    }

    document.getElementById("review").innerHTML =
        html;

}


/* =====================================================
   RETAKE TEST
   ===================================================== */

function retakeTest(){

    clearInterval(timerInterval);

    currentQuestion = 0;

    userAnswers =
        new Array(100).fill(null);

    timeLeft = 60 * 60;

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("startScreen")
        .classList.remove("hidden");

    document.getElementById("timer").innerHTML =
        "60:00";

}

</script>
